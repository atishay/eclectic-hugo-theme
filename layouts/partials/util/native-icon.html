{{- $iconPath := print "image/line-awesome/fa-" $.type ".svg" -}}
{{- $icon := resources.Get $iconPath -}}
{{- if $icon -}}
{{- $icon = $icon | resources.Minify -}}
{{- $class := "icon" -}}
{{- with $.class}}{{$class = .}}{{end -}}
{{- $result := print "<svg width=\"" $.size "px\" class=\"" $class "\" " -}}
{{- $icon = replace $icon.Content "<svg " $result -}}
{{- $icon = replace $icon "<path " "<path fill=\"currentColor\" " }}
{{ $icon | safeHTML }}
{{- else -}}
{{- warnf "Icon not found: %s (type: %s)" $iconPath $.type -}}
<!-- Missing icon: {{ $.type }} -->
{{- end -}}
